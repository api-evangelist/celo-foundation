name: Celo Foundation
description: >-
  Celo is an Ethereum Layer 2 blockchain built for real-world payments and
  financial inclusion, offering sub-cent transaction fees, one-second block
  times, native stablecoins, and the ability to pay gas in ERC-20 tokens such as
  USDC and USDT. The Celo Foundation is the nonprofit stewarding the protocol and
  its ecosystem. Developers build on Celo with EVM-compatible tooling: the
  ContractKit and Connect JavaScript SDKs, the celocli command-line interface,
  a documented Model Context Protocol (MCP) server for AI agents, ethers.js/viem
  support, Hardhat/Foundry environments, the Alfajores testnet with a public
  faucet, and MiniPay mobile-wallet integrations. This profile was seeded as a
  polychain portfolio lead and enriched from Celo's public developer surface.
